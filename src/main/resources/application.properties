# Identidade da aplicacao
spring.application.name=apecan

# Servidor HTTP e proxy reverso
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=30s
server.shutdown=graceful
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Sessao e cookies
server.servlet.session.timeout=${APECAN_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=APECAN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APECAN_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Respostas de erro: nunca expor detalhes internos ao cliente
spring.mvc.problemdetails.enabled=true
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never

# Compressao de respostas
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

# Uploads; a recuperacao continua limitada e validada novamente pelo modulo de backup
spring.servlet.multipart.max-file-size=${APECAN_MAX_FILE_SIZE:${apecan.backup.tamanho-maximo}}
spring.servlet.multipart.max-request-size=${APECAN_MAX_REQUEST_SIZE:2049MB}

# Backup local criptografado
apecan.backup.pg-dump-path=${APECAN_PG_DUMP_PATH:pg_dump}
apecan.backup.pg-restore-path=${APECAN_PG_RESTORE_PATH:pg_restore}
apecan.backup.diretorio-temporario=${APECAN_BACKUP_TEMP:${java.io.tmpdir}/apecan-backup}
apecan.backup.tamanho-maximo=${APECAN_BACKUP_MAX_SIZE:2GB}
apecan.backup.tamanho-descompactado-maximo=${APECAN_BACKUP_MAX_UNCOMPRESSED_SIZE:10GB}
apecan.backup.timeout=${APECAN_BACKUP_TIMEOUT:30m}
apecan.backup.iteracoes-pbkdf2=${APECAN_BACKUP_PBKDF2_ITERATIONS:600000}

# Ativacao local de contas; a entrega por e-mail substituira este adaptador
apecan.ativacao.entrega=${APECAN_ACTIVATION_DELIVERY:local}
apecan.ativacao.validade=${APECAN_ACTIVATION_VALIDITY:24h}
apecan.redefinicao.entrega=${APECAN_PASSWORD_RESET_DELIVERY:local}
apecan.redefinicao.validade=${APECAN_PASSWORD_RESET_VALIDITY:1h}

# Protecao progressiva contra tentativas repetidas de login
apecan.login.limite-tentativas=${APECAN_LOGIN_ATTEMPT_LIMIT:5}
apecan.login.janela=${APECAN_LOGIN_ATTEMPT_WINDOW:15m}
apecan.login.bloqueio-inicial=${APECAN_LOGIN_INITIAL_BLOCK:1m}
apecan.login.bloqueio-maximo=${APECAN_LOGIN_MAX_BLOCK:15m}
apecan.url-publica=${APECAN_PUBLIC_URL:http://localhost:${server.port}}

# PostgreSQL: a senha e obrigatoria e nunca possui valor padrao
spring.datasource.url=${APECAN_DB_URL}
spring.datasource.username=${APECAN_DB_USERNAME}
spring.datasource.password=${APECAN_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes HikariCP
spring.datasource.hikari.pool-name=ApecanHikariPool
spring.datasource.hikari.maximum-pool-size=${APECAN_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${APECAN_DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${APECAN_DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.generate_statistics=false

# Migracoes versionadas do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# E-mail para recuperacao de senha
apecan.mail.transporte=${APECAN_MAIL_TRANSPORT:smtp}
apecan.acesso.chave-hmac=${APECAN_ACCESS_HMAC_KEY:apecan-desenvolvimento-nao-usar-em-producao}
spring.mail.host=${APECAN_MAIL_HOST:localhost}
spring.mail.port=${APECAN_MAIL_PORT:587}
spring.mail.username=${APECAN_MAIL_USERNAME:}
spring.mail.password=${APECAN_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=${APECAN_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${APECAN_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${APECAN_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Datas e JSON
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Monitoramento: somente endpoints nao sensiveis
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${APECAN_MAIL_HEALTH_ENABLED:false}

# Logs: detalhes SQL e valores vinculados permanecem desativados
logging.level.root=INFO
logging.level.com.aclg.apecan=${APECAN_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
