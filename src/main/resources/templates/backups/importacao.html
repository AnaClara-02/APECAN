<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Importação de backup | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo conteudo-estreito">
    <div th:replace="~{fragments/cabecalho :: mensagens}"></div>
    <section class="cabecalho-pagina"><div><p class="rotulo">Backup</p><h1>Importação</h1>
        <p class="texto-secundario">Analise um SQL gerado pelo APECAN antes de substituir os dados atuais.</p></div></section>
    <div class="alerta alerta-aviso" role="note">A importação não cria nem substitui usuários. Você continuará acessando o sistema com as contas desta instalação.</div>
    <section class="cartao">
        <h2>Selecionar backup</h2>
        <form class="formulario" th:action="@{/administracao/backups/importacao/analisar}" th:object="${importarBackupSqlForm}" method="post" enctype="multipart/form-data">
            <div class="alerta alerta-erro" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>
            <label for="arquivo">Arquivo SQL do APECAN</label>
            <input id="arquivo" type="file" th:field="*{arquivo}" accept=".sql,application/sql,text/plain" required>
            <small class="erro-campo" th:errors="*{arquivo}"></small>
            <button class="botao botao-primario" type="submit">Analisar arquivo</button>
        </form>
    </section>
</main></body></html>
