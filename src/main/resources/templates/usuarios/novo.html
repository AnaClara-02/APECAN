<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo usuario | APECAN</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/cpf-mask.js}"></script>
</head>
<body>
<header class="cabecalho">
    <a class="marca marca-clara" th:href="@{/inicio}"><span class="marca-sigla">APECAN</span></a>
    <nav class="navegacao"><a th:href="@{/usuarios}">Voltar aos usuarios</a></nav>
</header>

<main class="conteudo conteudo-estreito">
    <section class="cabecalho-pagina">
        <div><p class="rotulo">Administracao</p><h1>Cadastrar funcionario</h1></div>
    </section>

    <form class="cartao formulario" th:action="@{/usuarios}"
          th:object="${novoUsuarioForm}" method="post">
        <div class="alerta alerta-erro" th:if="${#fields.hasGlobalErrors()}"
             th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>

        <label for="nome">Nome completo</label>
        <input id="nome" type="text" th:field="*{nome}" maxlength="150" required>
        <span class="erro-campo" th:errors="*{nome}"></span>

        <label for="login">Login</label>
        <input id="login" type="text" th:field="*{login}" maxlength="50"
               autocomplete="off" required>
        <span class="ajuda">De 3 a 50 letras, numeros, ponto, hifen ou sublinhado.</span>
        <span class="erro-campo" th:errors="*{login}"></span>

        <label for="cpf">CPF</label>
        <input id="cpf" type="text" th:field="*{cpf}" data-cpf required>
        <span class="erro-campo" th:errors="*{cpf}"></span>

        <label for="email">E-mail</label>
        <input id="email" type="email" th:field="*{email}" maxlength="254" required>
        <span class="erro-campo" th:errors="*{email}"></span>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" th:field="*{telefone}" maxlength="20" required>
        <span class="erro-campo" th:errors="*{telefone}"></span>

        <div class="acoes">
            <button class="botao botao-primario" type="submit">Cadastrar e gerar ativacao</button>
            <a class="botao botao-secundario" th:href="@{/usuarios}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
