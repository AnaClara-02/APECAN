<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo usuário | APECAN</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/cpf-mask.js}"></script>
    <script defer th:src="@{/js/telefone-mask.js}"></script>
</head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>

<main id="conteudo-principal" class="conteudo conteudo-estreito">
    <section class="cabecalho-pagina">
        <div><p class="rotulo">Administração</p><h1>Cadastrar funcionário</h1></div>
        <a class="botao botao-secundario" th:href="@{/usuarios}">Voltar</a>
    </section>

    <form class="cartao formulario" th:action="@{/usuarios}"
          th:object="${novoUsuarioForm}" method="post">
        <div class="alerta alerta-erro" th:if="${#fields.hasGlobalErrors()}"
             th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>

        <label for="nome">Nome completo</label>
        <input id="nome" type="text" th:field="*{nome}" maxlength="150" autocomplete="name"
               data-somente-letras title="Use somente letras, espaços, apóstrofos e hífens." required>
        <span class="erro-campo" th:errors="*{nome}"></span>

        <label for="login">Login</label>
        <input id="login" type="text" th:field="*{login}" maxlength="50"
               autocomplete="off" required>
        <span class="ajuda">De 3 a 50 letras, números, ponto, hífen ou sublinhado.</span>
        <span class="erro-campo" th:errors="*{login}"></span>

        <label for="cpf">CPF</label>
        <input id="cpf" type="text" th:field="*{cpf}" data-cpf required>
        <span class="erro-campo" th:errors="*{cpf}"></span>

        <label for="email">E-mail</label>
        <input id="email" type="email" th:field="*{email}" maxlength="254" required>
        <span class="erro-campo" th:errors="*{email}"></span>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" th:field="*{telefone}" data-telefone autocomplete="tel" required>
        <span class="erro-campo" th:errors="*{telefone}"></span>

        <div class="acoes">
            <button class="botao botao-primario" type="submit">Cadastrar e gerar ativação</button>
            <a class="botao botao-secundario" th:href="@{/usuarios}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
