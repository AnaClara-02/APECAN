<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do usuário | APECAN</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>

<main id="conteudo-principal" class="conteudo">
    <section class="cabecalho-pagina">
        <div><p class="rotulo">Usuário</p><h1 th:text="${usuario.nome}">Nome</h1></div>
        <div class="acoes"><a class="botao botao-secundario" th:href="@{/usuarios}">Voltar</a><a class="botao botao-primario" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar dados</a></div>
    </section>

    <div th:replace="~{fragments/cabecalho :: mensagens}"></div>

    <section class="grade-cartoes">
        <article class="cartao dados">
            <h2>Dados da conta</h2>
            <dl>
                <dt>Login</dt><dd th:text="${usuario.login}">login</dd>
                <dt>CPF</dt><dd th:text="${usuario.cpf}">CPF</dd>
                <dt>E-mail</dt><dd th:text="${usuario.email}">email</dd>
                <dt>Telefone</dt><dd th:text="${usuario.telefone}">telefone</dd>
                <dt>Perfil</dt><dd th:text="${usuario.tipoPerfil}">perfil</dd>
                <dt>Status</dt><dd th:text="${usuario.status}">status</dd>
                <dt>Ativação</dt><dd th:text="${usuario.primeiroAcessoPendente ? 'Pendente' : 'Concluída'}">estado</dd>
            </dl>
        </article>

        <article class="cartao">
            <h2>Gerenciar acesso</h2>
            <p class="texto-secundario">
                Alterações de perfil e status exigem sua senha e uma justificativa para auditoria.
            </p>

            <form class="formulario formulario-compacto"
                  th:if="${usuario.primeiroAcessoPendente and usuario.estaAtivo()}"
                  th:action="@{/usuarios/{id}/reenviar-ativacao(id=${usuario.id})}" method="post">
                <button class="botao botao-secundario" type="submit">Gerar novo link de ativação</button>
            </form>

            <form class="formulario formulario-compacto"
                  th:object="${alterarAcessoForm}"
                  th:action="${usuario.tipoPerfil.name() == 'ADMINISTRADOR'}
                    ? @{/usuarios/{id}/rebaixar(id=${usuario.id})}
                    : @{/usuarios/{id}/promover(id=${usuario.id})}"
                  method="post">
                <label for="justificativaPerfil">Justificativa</label>
                <textarea id="justificativaPerfil" th:field="*{justificativa}" maxlength="500" required></textarea>
                <label for="senhaPerfil">Sua senha atual</label>
                <input id="senhaPerfil" type="password" th:field="*{senhaAtual}" autocomplete="current-password" required>
                <button class="botao botao-secundario" type="submit"
                        th:text="${usuario.tipoPerfil.name() == 'ADMINISTRADOR'} ? 'Alterar para usuário' : 'Promover a administrador'">
                    Alterar perfil
                </button>
            </form>

            <form class="formulario formulario-compacto"
                  th:object="${alterarAcessoForm}"
                  th:if="${usuarioLogado != null and usuario.id != usuarioLogado.id()}"
                  th:action="${usuario.estaAtivo()}
                    ? @{/usuarios/{id}/desativar(id=${usuario.id})}
                    : @{/usuarios/{id}/reativar(id=${usuario.id})}"
                  method="post">
                <label for="justificativaStatus">Justificativa</label>
                <textarea id="justificativaStatus" th:field="*{justificativa}" maxlength="500" required></textarea>
                <label for="senhaStatus">Sua senha atual</label>
                <input id="senhaStatus" type="password" th:field="*{senhaAtual}" autocomplete="current-password" required>
                <button class="botao" th:classappend="${usuario.estaAtivo()} ? ' botao-perigo' : ' botao-secundario'"
                        type="submit" th:text="${usuario.estaAtivo()} ? 'Desativar usuário' : 'Reativar usuário'">
                    Alterar status
                </button>
            </form>
        </article>
    </section>
</main>
</body>
</html>
