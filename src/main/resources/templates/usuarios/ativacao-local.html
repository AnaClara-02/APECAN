<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link de ativação | APECAN</title>
    <script th:src="@{/js/theme-init.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="pagina-centralizada">
<a class="pular-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>
<main id="conteudo-principal" class="cartao ativacao-local">
    <div th:replace="~{fragments/cabecalho :: marca-publica}"></div>
    <p class="rotulo">Exibição única</p>
    <h1>Conta de <span th:text="${nomeUsuario}">usuário</span> preparada</h1>
    <div class="alerta alerta-aviso" th:if="${ativacao.linkLocal != null}">
        Copie e entregue este link somente ao titular da conta. Ele não será mostrado novamente.
    </div>
    <div class="alerta alerta-sucesso" th:if="${ativacao.linkLocal == null}">
        As instruções de ativação foram enviadas ao e-mail cadastrado.
    </div>
    <label for="linkAtivacao" th:if="${ativacao.linkLocal != null}">Link de ativação</label>
    <textarea id="linkAtivacao" class="campo-link" readonly
              th:if="${ativacao.linkLocal != null}" th:text="${ativacao.linkLocal}"></textarea>
    <p class="texto-secundario">Válido até <span th:text="${ativacao.expiraEm}"></span>.</p>
    <div class="acoes">
        <a class="botao botao-primario" th:if="${ativacao.linkLocal != null}"
           th:href="${ativacao.linkLocal}">Abrir link neste computador</a>
        <a class="botao botao-secundario" th:href="@{/usuarios}">Concluir</a>
    </div>
</main>
</body>
</html>
