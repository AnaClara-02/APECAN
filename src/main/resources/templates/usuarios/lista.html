<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários | APECAN</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>

<main id="conteudo-principal" class="conteudo">
    <section class="cabecalho-pagina">
        <div>
            <p class="rotulo">Administração</p>
            <h1>Usuários</h1>
            <p class="texto-secundario">Gerencie contas individuais e responsabilidades administrativas.</p>
        </div>
        <a class="botao botao-primario" th:href="@{/usuarios/novo}">Cadastrar funcionário</a>
    </section>

    <div class="alerta alerta-aviso alerta-centralizado" role="status" th:if="${quantidadeAdministradores < 2}">
        Há menos de dois administradores ativos. Ative e promova um sucessor.
    </div>

    <section class="cartao tabela-responsiva" tabindex="0" aria-label="Lista de usuários">
        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>Login</th>
                <th>Perfil</th>
                <th>Status</th>
                <th>Ativação</th>
                <th><span class="sr-only">Ações</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nome}">Nome</td>
                <td th:text="${usuario.login}">login</td>
                <td><span class="status" th:text="${usuario.tipoPerfil}">USUÁRIO</span></td>
                <td><span class="status" th:classappend="${usuario.estaAtivo()} ? ' status-sucesso'" th:text="${usuario.status}">ATIVO</span></td>
                <td th:text="${usuario.primeiroAcessoPendente ? 'Pendente' : 'Concluída'}">Pendente</td>
                <td><a th:href="@{/usuarios/{id}(id=${usuario.id})}">Consultar</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="6">Nenhum usuário cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
