<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doações | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><div><p class="rotulo">Operações</p><h1>Doações</h1><p class="texto-secundario">Registre as contribuições recebidas pela associação.</p></div><a class="botao botao-primario" th:href="@{/doacoes/nova}">Nova doação</a></section>
    <form class="filtros" method="get" th:action="@{/doacoes}"><div><label for="tipo">Tipo</label><select id="tipo" name="tipo"><option value="">Todos</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${t == tipoSelecionado}"></option></select></div><div><label for="inicio">De</label><input id="inicio" type="date" name="inicio" th:value="${inicio}"></div><div><label for="fim">Até</label><input id="fim" type="date" name="fim" th:value="${fim}"></div><button class="botao botao-secundario">Aplicar filtros</button></form>
    <div class="cartao tabela-responsiva" tabindex="0" aria-label="Lista de doações"><table><thead><tr><th>Data</th><th>Tipo</th><th>Fonte</th><th>Conteúdo</th></tr></thead><tbody><tr th:each="d : ${pagina.content}"><td th:text="${d.dataDoacao}"></td><td><span class="status" th:text="${d.tipo}"></span></td><td th:text="${d.fonteDoacao}"></td><td><span th:if="${d.valor != null}" th:text="|R$ ${d.valor}|"></span><span th:if="${d.equipamentos > 0}" th:text="|${d.equipamentos} equipamento(s)|"></span><span th:if="${d.quantidade != null}" th:text="|${d.quantidade} ${d.unidade}|"></span></td></tr><tr th:if="${pagina.empty}"><td colspan="4">Nenhuma doação encontrada no período.</td></tr></tbody></table></div>
    <nav class="paginacao" aria-label="Paginação" th:if="${pagina.totalPages > 1}"><a class="botao botao-secundario" th:if="${pagina.hasPrevious()}" th:href="@{/doacoes(pagina=${pagina.number - 1},tipo=${tipoSelecionado},inicio=${inicio},fim=${fim})}">Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span><a class="botao botao-secundario" th:if="${pagina.hasNext()}" th:href="@{/doacoes(pagina=${pagina.number + 1},tipo=${tipoSelecionado},inicio=${inicio},fim=${fim})}">Próxima</a></nav>
</main></body></html>
