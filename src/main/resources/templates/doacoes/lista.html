<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doacoes | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><h1>Doacoes</h1><a class="botao botao-primario" th:href="@{/doacoes/nova}">Nova doacao</a></section><form class="filtros"><select name="tipo"><option value="">Todos os tipos</option><option th:each="t:${tipos}" th:value="${t}" th:text="${t}" th:selected="${t==tipoSelecionado}"></option></select><input type="date" name="inicio" th:value="${inicio}"><input type="date" name="fim" th:value="${fim}"><button class="botao">Filtrar</button></form><div class="cartao"><table><thead><tr><th>Data</th><th>Tipo</th><th>Fonte</th><th>Conteudo</th></tr></thead><tbody><tr th:each="d:${pagina.content}"><td th:text="${d.dataDoacao}"></td><td th:text="${d.tipo}"></td><td th:text="${d.fonteDoacao}"></td><td><span th:if="${d.valor!=null}" th:text="|R$ ${d.valor}|"></span><span th:if="${d.equipamentos>0}" th:text="|${d.equipamentos} equipamento(s)|"></span><span th:if="${d.quantidade!=null}" th:text="|${d.quantidade} ${d.unidade}|"></span></td></tr></tbody></table></div></main></body></html>
