<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova doacao | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo cartao"><h1>Nova doacao</h1><p class="texto-secundario">Preencha apenas o bloco correspondente ao tipo. Doacao monetaria cria entrada; equipamentos criam unidades individuais no estoque.</p><form class="formulario" th:action="@{/doacoes}" th:object="${doacaoForm}" method="post"><div class="alerta alerta-erro" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><label>Tipo</label><select th:field="*{tipo}" required><option value="">Selecione</option><option th:each="t:${tipos}" th:value="${t}" th:text="${t}"></option></select><label>Data</label><input type="date" th:field="*{dataDoacao}" required><label>Fonte/doador</label><input th:field="*{fonteDoacao}" maxlength="150" required><h2>Monetaria</h2><label>Valor</label><input type="number" step="0.01" min="0.01" th:field="*{valor}"><h2>Equipamentos</h2><label>Categoria</label><select th:field="*{categoriaId}"><option value="">Selecione</option><option th:each="c:${categorias}" th:value="${c.id}" th:text="${c.nome}"></option></select><label>Conservacao</label><select th:field="*{estadoConservacao}"><option value="">Selecione</option><option th:each="e:${conservacoes}" th:value="${e}" th:text="${e}"></option></select><label>Quantidade de unidades</label><input type="number" min="1" max="100" th:field="*{quantidadeEquipamentos}"><h2>Outro bem</h2><label>Quantidade</label><input type="number" step="0.001" min="0.001" th:field="*{quantidade}"><label>Unidade</label><input th:field="*{unidade}" maxlength="30"><h2>Participantes voluntarios (opcional)</h2><label>Doador</label><select th:field="*{doadorId}"><option value="">Nenhum</option><option th:each="v:${voluntarios}" th:value="${v.id}" th:text="${v.nome}"></option></select><label>Responsavel</label><select th:field="*{responsavelId}"><option value="">Nenhum</option><option th:each="v:${voluntarios}" th:value="${v.id}" th:text="${v.nome}"></option></select><button class="botao botao-primario">Registrar doacao</button></form></main></body></html>
