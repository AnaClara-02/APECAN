<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Empréstimos | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}">    <link rel="icon" type="image/png" th:href="@{/images/logo-apecan.png(v=2)}">
</head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div>
    <section class="cabecalho-pagina"><div><p class="rotulo">Operações</p><h1>Empréstimos</h1><p class="texto-secundario">Acompanhe equipamentos cedidos e prazos de devolução.</p></div><a class="botao botao-primario" th:href="@{/emprestimos/novo}">Novo empréstimo</a></section>
    <form class="filtros" method="get" th:action="@{/emprestimos}"><div><label for="status">Status</label><select id="status" name="status"><option th:each="s : ${statusDisponiveis}" th:value="${s}" th:text="${s.name() == 'ATIVO' ? 'ATIVO (em aberto)' : (s.name() == 'INATIVO' ? 'INATIVO (devolvido)' : 'TODOS')}" th:selected="${s == statusSelecionado}"></option></select></div><button class="botao botao-secundario">Aplicar filtro</button></form>
    <div class="cartao tabela-responsiva" tabindex="0" aria-label="Lista de empréstimos"><table><thead><tr><th>Equipamento</th><th>Paciente</th><th>Empréstimo</th><th>Previsão ou devolução</th><th>Status</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody>
        <tr th:each="e : ${pagina.content}" th:with="voltarUrl=@{/emprestimos(pagina=${pagina.number},status=${statusSelecionado})}"><td th:text="|#${e.equipamentoId} · ${e.categoria}|"></td><td th:text="${e.paciente}"></td><td th:text="${e.dataEmprestimo}"></td><td th:text="${e.dataDevolucao ?: e.dataPrevistaDevolucao}"></td><td><span class="status" th:classappend="${e.atrasado} ? ' status-perigo' : (${e.dataDevolucao == null} ? ' status-aviso' : ' status-sucesso')" th:text="${e.atrasado ? 'Atrasado' : (e.dataDevolucao == null ? 'Aberto' : 'Concluído')}"></span></td><td><a th:href="@{/emprestimos/{id}(id=${e.id})}">Consultar</a><a th:if="${usuarioLogado.admDev()}" th:href="@{/administracao/testes/exclusoes/EMPRESTIMO/{id}(id=${e.id},voltar=${voltarUrl})}">Excluir teste</a></td></tr>
        <tr th:if="${pagina.empty}"><td colspan="6">Nenhum empréstimo encontrado.</td></tr>
    </tbody></table></div>
    <nav class="paginacao" aria-label="Paginação" th:if="${pagina.totalPages > 1}"><a class="botao botao-secundario" th:if="${pagina.hasPrevious()}" th:href="@{/emprestimos(pagina=${pagina.number - 1},status=${statusSelecionado})}">Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span><a class="botao botao-secundario" th:if="${pagina.hasNext()}" th:href="@{/emprestimos(pagina=${pagina.number + 1},status=${statusSelecionado})}">Próxima</a></nav>
</main></body></html>
