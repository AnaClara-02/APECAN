<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emprestimos | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><h1>Emprestimos</h1><a class="botao botao-primario" th:href="@{/emprestimos/novo}">Novo emprestimo</a></section><form class="filtros"><label><input type="checkbox" name="abertos" value="true" th:checked="${abertos}"> Apenas abertos</label><button class="botao">Aplicar</button></form><div class="cartao"><table><thead><tr><th>Equipamento</th><th>Paciente</th><th>Emprestimo</th><th>Previsao/devolucao</th><th></th></tr></thead><tbody><tr th:each="e:${pagina.content}"><td th:text="|#${e.equipamentoId} · ${e.categoria}|"></td><td th:text="${e.paciente}"></td><td th:text="${e.dataEmprestimo}"></td><td><span th:text="${e.dataDevolucao?:e.dataPrevistaDevolucao}"></span> <strong th:if="${e.atrasado}">ATRASADO</strong></td><td><a th:href="@{/emprestimos/{id}(id=${e.id})}">Consultar</a></td></tr></tbody></table></div></main></body></html>
