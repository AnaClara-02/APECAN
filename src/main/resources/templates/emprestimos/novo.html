<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo emprestimo | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo cartao"><h1>Novo emprestimo</h1><form class="formulario" th:action="@{/emprestimos}" th:object="${emprestimoForm}" method="post"><div class="alerta alerta-erro" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><label>Equipamento</label><select th:field="*{equipamentoId}" required><option value="">Selecione</option><option th:each="e:${equipamentos}" th:value="${e.id}" th:text="|Equipamento #${e.id} · ${e.categoria.nome}|"></option></select><label>Paciente</label><select th:field="*{pacienteId}" required><option value="">Selecione</option><option th:each="p:${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option></select><label>Data do emprestimo</label><input type="date" th:field="*{dataEmprestimo}" required><label>Previsao de devolucao</label><input type="date" th:field="*{dataPrevistaDevolucao}" required><label>Observacao</label><textarea th:field="*{observacao}" maxlength="255"></textarea><button class="botao botao-primario">Registrar</button></form></main></body></html>
