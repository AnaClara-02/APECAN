<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emprestimo | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cartao"><h1 th:text="|Emprestimo #${emprestimo.id}|"></h1><p th:text="|Equipamento #${emprestimo.equipamentoId} · ${emprestimo.categoria}|"></p><p th:text="|Paciente: ${emprestimo.paciente}|"></p><p th:text="|Data: ${emprestimo.dataEmprestimo} · previsao: ${emprestimo.dataPrevistaDevolucao}|"></p><p th:if="${emprestimo.dataDevolucao}" th:text="|Devolvido em ${emprestimo.dataDevolucao}|"></p></section><section class="cartao" th:if="${emprestimo.dataDevolucao==null}"><h2>Registrar devolucao</h2><form class="formulario" th:action="@{/emprestimos/{id}/devolucao(id=${emprestimo.id})}" th:object="${devolucaoForm}" method="post"><label>Data</label><input type="date" th:field="*{dataDevolucao}" required><label>Estado de conservacao</label><select th:field="*{estadoConservacao}" required><option value="">Selecione</option><option th:each="c:${conservacoes}" th:value="${c}" th:text="${c}"></option></select><label><input type="checkbox" th:field="*{inativarEquipamento}"> Inativar equipamento apos devolucao</label><button class="botao botao-primario">Confirmar devolucao</button></form></section></main></body></html>
