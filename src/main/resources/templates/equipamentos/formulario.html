<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Equipamento | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}">    <link rel="icon" type="image/png" th:href="@{/images/logo-apecan.png(v=2)}">
</head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo conteudo-estreito"><section class="cabecalho-pagina"><div><p class="rotulo">Equipamentos</p><h1 th:text="${equipamento == null ? 'Novo equipamento' : 'Editar equipamento #' + equipamento.id}"></h1></div><a class="botao botao-secundario" th:href="@{/equipamentos}">Voltar</a></section>
    <form class="cartao formulario" th:action="${equipamento == null} ? @{/equipamentos} : @{/equipamentos/{id}/editar(id=${equipamento.id})}" th:object="${equipamentoForm}" method="post"><label for="categoria">Categoria</label><select id="categoria" th:field="*{categoriaId}" required><option value="">Selecione</option><option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option></select><p class="erro-campo" th:errors="*{categoriaId}"></p><label for="estado">Estado de conservação</label><select id="estado" th:field="*{estadoConservacao}" required><option value="">Selecione</option><option th:each="e : ${conservacoes}" th:value="${e}" th:text="${e}"></option></select><p class="erro-campo" th:errors="*{estadoConservacao}"></p><div class="acoes"><button class="botao botao-primario">Salvar equipamento</button><a class="botao" th:href="@{/equipamentos}">Cancelar</a></div></form>
</main></body></html>
