<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipamento | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo cartao"><h1 th:text="${equipamento==null?'Novo equipamento': 'Editar Equipamento #'+equipamento.id}"></h1><form class="formulario" th:action="${equipamento==null}?@{/equipamentos}:@{/equipamentos/{id}/editar(id=${equipamento.id})}" th:object="${equipamentoForm}" method="post"><label for="categoria">Categoria</label><select id="categoria" th:field="*{categoriaId}" required><option value="">Selecione</option><option th:each="c:${categorias}" th:value="${c.id}" th:text="${c.nome}"></option></select><p class="erro-campo" th:errors="*{categoriaId}"></p><label for="estado">Conservacao</label><select id="estado" th:field="*{estadoConservacao}" required><option value="">Selecione</option><option th:each="e:${conservacoes}" th:value="${e}" th:text="${e}"></option></select><p class="erro-campo" th:errors="*{estadoConservacao}"></p><button class="botao botao-primario">Salvar</button></form></main></body></html>
