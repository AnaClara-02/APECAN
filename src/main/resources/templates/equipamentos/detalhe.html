<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Equipamento | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><div><p class="rotulo">Equipamento</p><h1 th:text="|Equipamento #${equipamento.id}|"></h1><span class="status" th:text="${equipamento.status}"></span></div><div class="acoes"><a class="botao botao-secundario" th:href="@{/equipamentos}">Voltar</a><a class="botao botao-primario" th:href="@{/equipamentos/{id}/editar(id=${equipamento.id})}">Editar</a></div></section><section class="cartao dados"><h2>Informações do equipamento</h2><dl><dt>Categoria</dt><dd th:text="${equipamento.categoria}"></dd><dt>Conservação</dt><dd th:text="${equipamento.estadoConservacao}"></dd><dt>Status</dt><dd th:text="${equipamento.status}"></dd></dl></section><form class="acoes" th:if="${equipamento.status.name() != 'EMPRESTADO'}" th:action="@{/equipamentos/{id}/status(id=${equipamento.id})}" method="post"><button class="botao" th:classappend="${equipamento.status.name() == 'ATIVO'} ? ' botao-perigo' : ' botao-secundario'" th:text="${equipamento.status.name() == 'ATIVO' ? 'Inativar equipamento' : 'Reativar equipamento'}"></button></form></main>
</body></html>
