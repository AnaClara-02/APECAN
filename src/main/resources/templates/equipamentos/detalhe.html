<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipamento | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cartao"><h1 th:text="|Equipamento #${equipamento.id}|"></h1><p th:text="|Categoria: ${equipamento.categoria}|"></p><p th:text="|Conservacao: ${equipamento.estadoConservacao}|"></p><p th:text="|Status: ${equipamento.status}|"></p><div class="acoes"><a class="botao" th:href="@{/equipamentos/{id}/editar(id=${equipamento.id})}">Editar</a><form th:if="${equipamento.status.name()!='EMPRESTADO'}" th:action="@{/equipamentos/{id}/status(id=${equipamento.id})}" method="post"><button class="botao" th:text="${equipamento.status.name()=='ATIVO'?'Inativar':'Reativar'}"></button></form></div></section></main></body></html>
