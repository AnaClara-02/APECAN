<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Equipamento | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><div><p class="rotulo">Equipamento</p><h1 th:text="|Equipamento #${equipamento.id}|"></h1><span class="status" th:text="${equipamento.status}"></span></div><div class="acoes"><a class="botao botao-secundario" th:href="@{/equipamentos}">Voltar</a><a class="botao botao-primario" th:href="@{/equipamentos/{id}/editar(id=${equipamento.id})}">Editar</a></div></section><section class="cartao dados"><h2>Informações do equipamento</h2><dl><dt>Categoria</dt><dd th:text="${equipamento.categoria}"></dd><dt>Conservação</dt><dd th:text="${equipamento.estadoConservacao}"></dd><dt>Status</dt><dd th:text="${equipamento.status}"></dd></dl></section><form class="acoes" th:if="${equipamento.status.name() != 'EMPRESTADO'}" th:action="@{/equipamentos/{id}/status(id=${equipamento.id})}" method="post"><button class="botao" th:classappend="${equipamento.status.name() == 'ATIVO'} ? ' botao-perigo' : ' botao-secundario'" th:text="${equipamento.status.name() == 'ATIVO' ? 'Inativar equipamento' : 'Reativar equipamento'}"></button></form>
<section class="cartao secao"><h2>Histórico de empréstimos</h2><div class="tabela-responsiva" tabindex="0"><table><thead><tr><th>Empréstimo</th><th>Paciente</th><th>Data</th><th>Previsão</th><th>Devolução</th><th>Conservação</th><th>Status</th></tr></thead><tbody><tr th:each="h : ${historico.content}"><td><a th:href="@{/emprestimos/{id}(id=${h.id})}" th:text="|#${h.id}|"></a></td><td><a th:href="@{/pacientes/{id}(id=${h.pacienteId})}" th:text="${h.paciente}"></a></td><td th:text="${h.dataEmprestimo}"></td><td th:text="${h.dataPrevistaDevolucao ?: '—'}"></td><td th:text="${h.dataDevolucao ?: '—'}"></td><td th:text="${h.estadoConservacaoDevolucao ?: '—'}"></td><td><span class="status" th:classappend="${h.situacao == 'ATRASADO'} ? ' status-perigo' : (${h.situacao == 'ATIVO'} ? ' status-aviso' : ' status-sucesso')" th:text="${h.situacao}"></span></td></tr><tr th:if="${historico.empty}"><td colspan="7">Este equipamento ainda não possui empréstimos.</td></tr></tbody></table></div><nav class="paginacao" th:if="${historico.totalPages > 1}" aria-label="Paginação do histórico"><a class="botao botao-secundario" th:if="${historico.hasPrevious()}" th:href="@{/equipamentos/{id}(id=${equipamento.id},paginaHistorico=${historico.number - 1})}">Anterior</a><span th:text="|Página ${historico.number + 1} de ${historico.totalPages}|"></span><a class="botao botao-secundario" th:if="${historico.hasNext()}" th:href="@{/equipamentos/{id}(id=${equipamento.id},paginaHistorico=${historico.number + 1})}">Próxima</a></nav></section>
</main></body></html>
