<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Equipamentos | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}">    <link rel="icon" type="image/png" th:href="@{/images/logo-apecan.png(v=2)}">
</head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div>
    <section class="cabecalho-pagina"><div><p class="rotulo">Operações</p><h1>Equipamentos</h1><p class="texto-secundario">Controle cada unidade disponível para apoio aos pacientes.</p></div><a class="botao botao-primario" th:href="@{/equipamentos/novo}">Novo equipamento</a></section>
    <section class="cartao"><h2>Cadastrar categoria</h2><form class="filtros" th:action="@{/equipamentos/categorias}" method="post"><div><label for="categoriaNome">Nome</label><input id="categoriaNome" name="nome" maxlength="80" required></div><div><label for="categoriaDescricao">Descrição</label><input id="categoriaDescricao" name="descricao" maxlength="255"></div><button class="botao botao-secundario" type="submit">Cadastrar categoria</button></form></section>
    <section class="grade-cartoes secao" aria-label="Resumo por categoria"><article class="cartao" th:each="r : ${resumo}"><h2 th:text="${r.categoria}"></h2><p><strong th:text="${r.quantidadeTotal}"></strong> unidades</p><p class="texto-secundario" th:text="|${r.quantidadeAtiva} ativas · ${r.quantidadeEmprestada} emprestadas · ${r.quantidadeInativa} inativas|"></p><form th:if="${r.quantidadeTotal == 0 and !usuarioLogado.admDev()}" th:action="@{/equipamentos/categorias/{id}/excluir(id=${r.idCategoria})}" method="post" data-confirmar="Excluir esta categoria vazia?"><button class="botao botao-perigo" type="submit">Excluir categoria</button></form><a class="botao botao-perigo" th:if="${r.quantidadeTotal == 0 and usuarioLogado.admDev()}" th:href="@{/administracao/testes/exclusoes/CATEGORIA/{id}(id=${r.idCategoria})}">Excluir categoria vazia</a></article></section>
    <form class="filtros secao" method="get" th:action="@{/equipamentos}"><input type="hidden" name="todos" value="true"><div><label for="categoriaId">Categoria</label><select id="categoriaId" name="categoriaId"><option value="">Todas</option><option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}" th:selected="${c.id == categoriaSelecionada}"></option></select></div><div><label for="status">Status</label><select id="status" name="status"><option value="" th:selected="${todosStatus}">Todos</option><option th:each="s : ${estados}" th:value="${s}" th:text="${s}" th:selected="${s == statusSelecionado}"></option></select></div><button class="botao botao-secundario">Aplicar filtros</button></form>
    <div class="cartao tabela-responsiva" tabindex="0" aria-label="Lista de equipamentos"><table><thead><tr><th>Identificação</th><th>Categoria</th><th>Conservação</th><th>Status</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody><tr th:each="e : ${pagina.content}" th:with="voltarUrl=@{/equipamentos(pagina=${pagina.number},categoriaId=${categoriaSelecionada},status=${statusSelecionado},todos=${todosStatus})}"><td th:text="|Equipamento #${e.id}|"></td><td th:text="${e.categoria}"></td><td th:text="${e.estadoConservacao}"></td><td><span class="status" th:text="${e.status}"></span></td><td><a th:href="@{/equipamentos/{id}(id=${e.id})}">Consultar</a><a class="botao botao-perigo" th:if="${usuarioLogado.admDev()}" th:href="@{/administracao/testes/exclusoes/EQUIPAMENTO/{id}(id=${e.id},voltar=${voltarUrl})}">Excluir teste</a></td></tr><tr th:if="${pagina.empty}"><td colspan="5">Nenhum equipamento encontrado.</td></tr></tbody></table></div>
    <nav class="paginacao" aria-label="Paginação" th:if="${pagina.totalPages > 1}"><a class="botao botao-secundario" th:if="${pagina.hasPrevious()}" th:href="@{/equipamentos(pagina=${pagina.number - 1},categoriaId=${categoriaSelecionada},status=${statusSelecionado},todos=${todosStatus})}">Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span><a class="botao botao-secundario" th:if="${pagina.hasNext()}" th:href="@{/equipamentos(pagina=${pagina.number + 1},categoriaId=${categoriaSelecionada},status=${statusSelecionado},todos=${todosStatus})}">Próxima</a></nav>
</main></body></html>
