<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipamentos | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><div><h1>Equipamentos</h1><p>Unidades individuais identificadas pelo ID.</p></div><a class="botao botao-primario" th:href="@{/equipamentos/novo}">Novo equipamento</a></section>
<section class="cartao"><h2>Nova categoria</h2><form class="filtros" th:action="@{/equipamentos/categorias}" method="post"><input name="nome" placeholder="Nome" maxlength="80" required><input name="descricao" placeholder="Descricao" maxlength="255"><button class="botao" type="submit">Cadastrar categoria</button></form></section>
<section class="grade-cartoes"><article class="cartao" th:each="r:${resumo}"><h3 th:text="${r.categoria}"></h3><p th:text="|Total: ${r.quantidadeTotal} · Ativos: ${r.quantidadeAtiva} · Emprestados: ${r.quantidadeEmprestada} · Inativos: ${r.quantidadeInativa}|"></p></article></section>
<form class="filtros" method="get"><select name="categoriaId"><option value="">Todas as categorias</option><option th:each="c:${categorias}" th:value="${c.id}" th:text="${c.nome}" th:selected="${c.id==categoriaSelecionada}"></option></select><select name="status"><option value="">Todos os status</option><option th:each="s:${estados}" th:value="${s}" th:text="${s}" th:selected="${s==statusSelecionado}"></option></select><button class="botao">Filtrar</button></form>
<div class="cartao"><table><thead><tr><th>Identificacao</th><th>Categoria</th><th>Conservacao</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="e:${pagina.content}"><td th:text="|Equipamento #${e.id}|"></td><td th:text="${e.categoria}"></td><td th:text="${e.estadoConservacao}"></td><td th:text="${e.status}"></td><td><a th:href="@{/equipamentos/{id}(id=${e.id})}">Consultar</a></td></tr></tbody></table><p th:if="${pagina.empty}">Nenhum equipamento encontrado.</p></div></main></body></html>
