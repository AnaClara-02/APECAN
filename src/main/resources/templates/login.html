<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | APECAN</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="pagina-centralizada">
<main class="cartao autenticacao">
    <div class="marca">
        <span class="marca-sigla">APECAN</span>
        <span>Associacao de Apoio a Pessoa com Cancer</span>
    </div>

    <h1>Acesso ao sistema</h1>
    <p class="texto-secundario">Entre com o login individual fornecido pela administracao.</p>

    <div class="alerta alerta-erro" th:if="${param.erro}">
        Usuario ou senha invalidos.
    </div>
    <div class="alerta alerta-sucesso" th:if="${param.logout}">
        Sessao encerrada com seguranca.
    </div>
    <div class="alerta alerta-sucesso" th:if="${param.ativada}">
        Conta ativada. Agora voce ja pode entrar.
    </div>
    <div class="alerta alerta-sucesso" th:if="${param.senhaRedefinida}">
        Senha redefinida. Entre novamente.
    </div>
    <div class="alerta alerta-sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>

    <form class="formulario" th:action="@{/login}" method="post">
        <label for="login">Login</label>
        <input id="login" name="login" type="text" autocomplete="username" required autofocus>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <button class="botao botao-primario" type="submit">Entrar</button>
    </form>
    <p><a th:href="@{/esqueci-senha}">Esqueci minha senha</a></p>
</main>
</body>
</html>
