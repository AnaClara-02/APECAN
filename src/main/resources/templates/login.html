<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | APECAN</title>
    <script th:src="@{/js/theme-init.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/login.js}"></script>
</head>
<body class="pagina-centralizada">
<a class="pular-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>
<main id="conteudo-principal" class="cartao autenticacao">
    <div th:replace="~{fragments/cabecalho :: marca-publica}"></div>

    <h1>Acesso ao sistema</h1>
    <p class="texto-secundario">Entre com o acesso individual fornecido pela administração.</p>

    <div class="alerta alerta-erro" role="alert" th:if="${param.erro}">
        Usuário ou senha inválidos.
    </div>
    <div class="alerta alerta-sucesso" th:if="${param.logout}">
        Sessão encerrada com segurança.
    </div>
    <div class="alerta alerta-sucesso" th:if="${param.ativada}">
        Conta ativada. Agora voce ja pode entrar.
    </div>
    <div class="alerta alerta-sucesso" th:if="${param.senhaRedefinida}">
        Senha redefinida. Entre novamente.
    </div>
    <div class="alerta alerta-sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>

    <form class="formulario" th:action="@{/login}" method="post">
        <label for="login">Login</label>
        <input id="login" name="login" type="text" autocomplete="username" required autofocus>

        <label for="senha">Senha</label>
        <div class="campo-senha">
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
            <button class="alternar-senha" type="button" data-alternar-senha aria-controls="senha"
                    aria-pressed="false" aria-label="Mostrar senha">
                <span data-rotulo-senha>Mostrar</span>
            </button>
        </div>

        <button class="botao botao-primario" type="submit">Entrar com segurança</button>
    </form>
    <p class="autenticacao-rodape"><a th:href="@{/esqueci-senha}">Esqueci minha senha</a></p>
    <p class="autenticacao-rodape" th:if="${recuperacaoDisponivel}">
        <a class="botao botao-secundario" th:href="@{/recuperacao}">Restaurar backup</a>
    </p>
</main>
</body>
</html>
