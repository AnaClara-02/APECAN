<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voluntário | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"><script defer th:src="@{/js/cpf-mask.js}"></script><script defer th:src="@{/js/telefone-mask.js}"></script></head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo conteudo-estreito">
    <section class="cabecalho-pagina"><div><p class="rotulo">Voluntários</p><h1 th:text="${voluntario == null ? 'Novo voluntário' : 'Editar voluntário'}"></h1></div><a class="botao botao-secundario" th:href="@{/voluntarios}">Voltar</a></section>
    <form class="cartao formulario" th:action="${voluntario == null} ? @{/voluntarios} : @{/voluntarios/{id}/editar(id=${voluntario.id})}" th:object="${voluntarioForm}" method="post">
        <div class="alerta alerta-erro" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        <label for="nome">Nome completo</label><input id="nome" th:field="*{nome}" maxlength="150" autocomplete="name" data-somente-letras title="Use somente letras, espaços, apóstrofos e hífens." required><p class="erro-campo" th:errors="*{nome}"></p>
        <label for="cpf">CPF</label><input id="cpf" th:field="*{cpf}" maxlength="14" inputmode="numeric" data-cpf th:readonly="${voluntario != null}" required><p class="erro-campo" th:errors="*{cpf}"></p>
        <label for="dataNascimento">Data de nascimento</label><input id="dataNascimento" type="date" th:field="*{dataNascimento}" th:max="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" required><p class="erro-campo" th:errors="*{dataNascimento}"></p>
        <label for="telefone">Telefone</label><input id="telefone" type="tel" th:field="*{telefone}" data-telefone autocomplete="tel" required><p class="erro-campo" th:errors="*{telefone}"></p>
        <label for="endereco">Endereço</label><input id="endereco" th:field="*{endereco}" minlength="5" maxlength="255" autocomplete="street-address" placeholder="Rua, número, bairro e cidade" required><p class="erro-campo" th:errors="*{endereco}"></p>
        <div class="acoes"><button class="botao botao-primario" type="submit">Salvar voluntário</button><a class="botao" th:href="@{/voluntarios}">Cancelar</a></div>
    </form>
</main></body></html>
