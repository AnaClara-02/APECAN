<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voluntários | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo">
    <div th:replace="~{fragments/cabecalho :: mensagens}"></div>
    <section class="cabecalho-pagina"><div><p class="rotulo">Atendimento</p><h1>Voluntários</h1><p class="texto-secundario">Consulte e mantenha os cadastros de quem apoia a associação.</p></div><a class="botao botao-primario" th:href="@{/voluntarios/novo}">Novo voluntário</a></section>
    <form class="filtros" method="get" th:action="@{/voluntarios}">
        <div><label for="nome">Nome</label><input id="nome" name="nome" th:value="${nome}" placeholder="Buscar por nome"></div>
        <div><label for="status">Status</label><select id="status" name="status"><option value="">Todos</option><option th:each="s : ${statusDisponiveis}" th:value="${s}" th:text="${s}" th:selected="${s == statusSelecionado}"></option></select></div>
        <button class="botao botao-secundario" type="submit">Aplicar filtros</button>
    </form>
    <div class="cartao tabela-responsiva" tabindex="0" aria-label="Lista de voluntários">
        <table><thead><tr><th>Nome</th><th>CPF</th><th>Status</th><th><span class="sr-only">Ações</span></th></tr></thead>
        <tbody><tr th:each="v : ${pagina.content}"><td th:text="${v.nome}"></td><td th:text="${v.cpfMascarado}"></td><td><span class="status" th:classappend="${v.status.name() == 'ATIVO'} ? ' status-sucesso'" th:text="${v.status}"></span></td><td><a th:href="@{/voluntarios/{id}(id=${v.id})}">Consultar</a></td></tr><tr th:if="${pagina.empty}"><td colspan="4">Nenhum voluntário encontrado com esses filtros.</td></tr></tbody></table>
    </div>
    <nav class="paginacao" aria-label="Paginação" th:if="${pagina.totalPages > 1}"><a class="botao botao-secundario" th:if="${pagina.hasPrevious()}" th:href="@{/voluntarios(pagina=${pagina.number - 1},nome=${nome},status=${statusSelecionado})}">Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span><a class="botao botao-secundario" th:if="${pagina.hasNext()}" th:href="@{/voluntarios(pagina=${pagina.number + 1},nome=${nome},status=${statusSelecionado})}">Próxima</a></nav>
</main></body></html>
