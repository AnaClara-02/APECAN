<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voluntarios | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div>
<section class="cabecalho-pagina"><div><h1>Voluntarios</h1><p class="texto-secundario">Cadastros preservados por inativacao.</p></div><a class="botao botao-primario" th:href="@{/voluntarios/novo}">Novo voluntario</a></section>
<form class="filtros" method="get"><input name="nome" th:value="${nome}" placeholder="Nome"><select name="status"><option value="">Todos</option><option th:each="s:${statusDisponiveis}" th:value="${s}" th:text="${s}" th:selected="${s==statusSelecionado}"></option></select><button class="botao" type="submit">Filtrar</button></form>
<div class="cartao"><table><thead><tr><th>Nome</th><th>CPF</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="v:${pagina.content}"><td th:text="${v.nome}"></td><td th:text="${v.cpfMascarado}"></td><td th:text="${v.status}"></td><td><a th:href="@{/voluntarios/{id}(id=${v.id})}">Consultar</a></td></tr></tbody></table><p th:if="${pagina.empty}">Nenhum voluntario encontrado.</p></div>
</main></body></html>
