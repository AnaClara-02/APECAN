<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voluntario | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><div><h1 th:text="${voluntario.nome}"></h1><p th:text="|CPF: ${voluntario.cpfMascarado}|"></p><p th:text="|Telefone: ${voluntario.telefone}|"></p><p th:text="|Endereco: ${voluntario.endereco}|"></p><p th:text="|Status: ${voluntario.status}|"></p></div><a class="botao" th:href="@{/voluntarios/{id}/editar(id=${voluntario.id})}">Editar</a></section><form th:action="@{/voluntarios/{id}/status(id=${voluntario.id})}" method="post"><button class="botao" type="submit" th:text="${voluntario.status.name()=='ATIVO'?'Inativar':'Reativar'}"></button></form></main></body></html>
