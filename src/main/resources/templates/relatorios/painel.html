<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatorios | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><section class="cabecalho-pagina"><div><h1>Relatorios</h1><p>Visao consolidada operacional e financeira.</p></div></section><form class="filtros"><label>Inicio <input type="date" name="inicio" th:value="${inicio}"></label><label>Fim <input type="date" name="fim" th:value="${fim}"></label><button class="botao">Aplicar periodo</button></form><section class="grade-cartoes"><article class="cartao"><h2>Pacientes</h2><p th:each="item:${relatorio.pacientes.entrySet()}" th:text="|${item.key}: ${item.value}|"></p></article><article class="cartao"><h2>Emprestimos</h2><p th:text="|Abertos: ${relatorio.emprestimosAbertos}|"></p><p th:text="|Atrasados: ${relatorio.emprestimosAtrasados}|"></p><p th:text="|Concluidos: ${relatorio.emprestimosConcluidos}|"></p></article><article class="cartao"><h2>Doacoes no periodo</h2><p th:each="item:${relatorio.doacoes.entrySet()}" th:text="|${item.key}: ${item.value}|"></p></article><article class="cartao"><h2>Financeiro no periodo</h2><p th:text="|Entradas: R$ ${relatorio.entradas}|"></p><p th:text="|Saidas: R$ ${relatorio.saidas}|"></p><strong th:text="|Saldo: R$ ${relatorio.saldo}|"></strong></article></section><section class="cartao"><h2>Equipamentos por categoria</h2><table><thead><tr><th>Categoria</th><th>Total</th><th>Ativos</th><th>Emprestados</th><th>Inativos</th></tr></thead><tbody><tr th:each="e:${relatorio.equipamentos}"><td th:text="${e.categoria}"></td><td th:text="${e.quantidadeTotal}"></td><td th:text="${e.quantidadeAtiva}"></td><td th:text="${e.quantidadeEmprestada}"></td><td th:text="${e.quantidadeInativa}"></td></tr></tbody></table></section></main></body></html>
