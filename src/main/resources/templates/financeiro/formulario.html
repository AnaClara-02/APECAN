<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Movimentação | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}">    <link rel="icon" type="image/png" th:href="@{/images/logo-apecan.png(v=2)}">
</head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo conteudo-estreito"><section class="cabecalho-pagina"><div><p class="rotulo">Financeiro</p><h1>Movimentação avulsa</h1><p class="texto-secundario">Registre uma entrada ou saída que não esteja vinculada a doação ou despesa.</p></div><a class="botao botao-secundario" th:href="@{/financeiro}">Voltar</a></section><form class="cartao formulario" th:action="@{/financeiro}" th:object="${movimentacaoForm}" method="post"><div class="alerta alerta-erro" role="alert" th:if="${#fields.hasAnyErrors()}">Revise os campos indicados antes de continuar.</div><label for="tipo">Tipo</label><select id="tipo" th:field="*{tipo}" required><option value="">Selecione</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option></select><p class="erro-campo" th:errors="*{tipo}"></p><label for="valor">Valor</label><input id="valor" type="number" step="0.01" min="0.01" th:field="*{valor}" required><p class="erro-campo" th:errors="*{valor}"></p><label for="data">Data</label><input id="data" type="date" th:field="*{data}" required><p class="erro-campo" th:errors="*{data}"></p><label for="destino">Destino</label><input id="destino" th:field="*{destino}" maxlength="150" required><p class="erro-campo" th:errors="*{destino}"></p><label for="descricao">Descrição da origem</label><input id="descricao" th:field="*{descricao}" maxlength="150" required><p class="erro-campo" th:errors="*{descricao}"></p><div class="acoes"><button class="botao botao-primario">Registrar movimentação</button><a class="botao" th:href="@{/financeiro}">Cancelar</a></div></form></main>
</body></html>
