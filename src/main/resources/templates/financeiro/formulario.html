<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movimentacao | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo cartao"><h1>Movimentacao avulsa</h1><form class="formulario" th:action="@{/financeiro}" th:object="${movimentacaoForm}" method="post"><label>Tipo</label><select th:field="*{tipo}" required><option value="">Selecione</option><option th:each="t:${tipos}" th:value="${t}" th:text="${t}"></option></select><label>Valor</label><input type="number" step="0.01" min="0.01" th:field="*{valor}" required><label>Data</label><input type="date" th:field="*{data}" required><label>Destino</label><input th:field="*{destino}" maxlength="150" required><label>Descricao da origem</label><input th:field="*{descricao}" maxlength="150" required><button class="botao botao-primario">Registrar</button></form></main></body></html>
