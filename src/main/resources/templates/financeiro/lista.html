<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><div><h1>Financeiro</h1><p th:text="|Saldo do periodo: R$ ${saldo}|"></p></div><div class="acoes"><a class="botao" th:href="@{/financeiro/despesas}">Despesas</a><a class="botao botao-primario" th:href="@{/financeiro/nova}">Nova movimentacao</a></div></section><form class="filtros"><select name="tipo"><option value="">Entradas e saidas</option><option th:each="t:${tipos}" th:value="${t}" th:text="${t}" th:selected="${t==tipoSelecionado}"></option></select><input type="date" name="inicio" th:value="${inicio}"><input type="date" name="fim" th:value="${fim}"><button class="botao">Filtrar</button></form><div class="cartao"><table><thead><tr><th>Data</th><th>Tipo</th><th>Valor</th><th>Origem</th><th>Descricao/destino</th></tr></thead><tbody><tr th:each="m:${pagina.content}"><td th:text="${m.data}"></td><td th:text="${m.tipo}"></td><td th:text="|R$ ${m.valor}|"></td><td th:text="${m.origem}"></td><td th:text="|${m.descricao} · ${m.destino}|"></td></tr></tbody></table></div></main></body></html>
