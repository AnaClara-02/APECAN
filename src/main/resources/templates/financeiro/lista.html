<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Financeiro | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}">    <link rel="icon" type="image/png" th:href="@{/images/logo-apecan.png(v=2)}">
</head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><div><p class="rotulo">Gestão</p><h1>Financeiro</h1><p class="texto-secundario">Saldo do período: <strong th:text="|R$ ${#numbers.formatDecimal(saldo, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</strong></p></div><div class="acoes"><a class="botao botao-secundario" th:href="@{/financeiro/despesas}">Ver despesas</a><a class="botao botao-primario" th:href="@{/financeiro/nova}">Nova movimentação</a></div></section>
    <form class="filtros" method="get" th:action="@{/financeiro}"><div><label for="tipo">Tipo</label><select id="tipo" name="tipo"><option value="">Entradas e saídas</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${t == tipoSelecionado}"></option></select></div><div><label for="inicio">De</label><input id="inicio" type="date" name="inicio" th:value="${inicio}"></div><div><label for="fim">Até</label><input id="fim" type="date" name="fim" th:value="${fim}"></div><button class="botao botao-secundario">Aplicar filtros</button></form>
    <div class="cartao tabela-responsiva" tabindex="0" aria-label="Movimentações financeiras"><table><thead><tr><th>Data</th><th>Tipo</th><th>Valor</th><th>Origem</th><th>Descrição e destino</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody><tr th:each="m : ${pagina.content}" th:with="voltarUrl=@{/financeiro(pagina=${pagina.number},tipo=${tipoSelecionado},inicio=${inicio},fim=${fim})}"><td th:text="${m.data}"></td><td><span class="status" th:classappend="${m.tipo.name() == 'ENTRADA'} ? ' status-sucesso' : ' status-aviso'" th:text="${m.tipo}"></span></td><td th:text="|R$ ${m.valor}|"></td><td th:text="${m.origem}"></td><td th:text="|${m.descricao} · ${m.destino}|"></td><td><th:block th:replace="~{fragments/exclusao-teste :: botao(tipo='MOVIMENTACAO',id=${m.id},voltar=${voltarUrl})}"></th:block></td></tr><tr th:if="${pagina.empty}"><td colspan="6">Nenhuma movimentação encontrada no período.</td></tr></tbody></table></div>
    <nav class="paginacao" aria-label="Paginação" th:if="${pagina.totalPages > 1}"><a class="botao botao-secundario" th:if="${pagina.hasPrevious()}" th:href="@{/financeiro(pagina=${pagina.number - 1},tipo=${tipoSelecionado},inicio=${inicio},fim=${fim})}">Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span><a class="botao botao-secundario" th:if="${pagina.hasNext()}" th:href="@{/financeiro(pagina=${pagina.number + 1},tipo=${tipoSelecionado},inicio=${inicio},fim=${fim})}">Próxima</a></nav>
</main></body></html>
