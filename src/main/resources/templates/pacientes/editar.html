<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar paciente | APECAN</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/telefone-mask.js}"></script>
    <link rel="icon" type="image/png" th:href="@{/images/logo-apecan.png(v=2)}">
</head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo conteudo-estreito">
    <section class="cabecalho-pagina"><div><p class="rotulo">Pacientes</p><h1>Editar paciente</h1></div><a class="botao botao-secundario" th:href="@{/pacientes/{id}(id=${paciente.id})}">Voltar</a></section>
    <form class="cartao formulario" th:action="@{/pacientes/{id}/editar(id=${paciente.id})}" th:object="${editarPacienteForm}" method="post">
        <div class="alerta alerta-erro" th:if="${#fields.hasGlobalErrors()}" th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>
        <label for="nome">Nome</label><input id="nome" th:field="*{nome}" maxlength="150" autocomplete="name" data-somente-letras title="Use somente letras, espaços, apóstrofos e hífens." required><span class="erro-campo" th:errors="*{nome}"></span>
        <label for="dataNascimento">Data de nascimento</label><input id="dataNascimento" type="date" th:field="*{dataNascimento}" th:max="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" required><span class="erro-campo" th:errors="*{dataNascimento}"></span>
        <label for="telefone">Telefone</label><input id="telefone" type="tel" th:field="*{telefone}" data-telefone autocomplete="tel" required><span class="erro-campo" th:errors="*{telefone}"></span>
        <label for="endereco">Endereço</label><input id="endereco" th:field="*{endereco}" minlength="5" maxlength="255" autocomplete="street-address" placeholder="Rua, número, bairro e cidade" required><span class="ajuda">Informe rua, número, bairro e cidade sempre que possível.</span><span class="erro-campo" th:errors="*{endereco}"></span>
        <label for="localTratamento">Local de tratamento</label><input id="localTratamento" th:field="*{localTratamento}" minlength="3" maxlength="150" placeholder="Hospital, clínica ou cidade" required><span class="ajuda">Informe o nome da unidade ou a cidade onde ocorre o tratamento.</span><span class="erro-campo" th:errors="*{localTratamento}"></span>
        <div class="acoes"><button class="botao botao-primario" type="submit">Salvar alterações</button><a class="botao" th:href="@{/pacientes/{id}(id=${paciente.id})}">Cancelar</a></div>
    </form>
</main>
</body>
</html>
