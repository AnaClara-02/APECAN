<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova despesa | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo cartao"><h1>Nova despesa</h1><p class="texto-secundario">Data e valor serao armazenados na movimentacao de saida; a despesa manterá o numero da nota.</p><form class="formulario" th:action="@{/financeiro/despesas}" th:object="${despesaForm}" method="post"><label>Tipo</label><input th:field="*{tipo}" maxlength="50" required><label>Descricao</label><input th:field="*{descricao}" maxlength="255" required><label>Numero da nota fiscal</label><input th:field="*{numeroNotaFiscal}" maxlength="20" required><label>Valor</label><input type="number" step="0.01" min="0.01" th:field="*{valor}" required><label>Data</label><input type="date" th:field="*{data}" required><label>Destino/beneficiario</label><input th:field="*{destino}" maxlength="150" required><button class="botao botao-primario">Registrar despesa e saida</button></form></main></body></html>
