<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nova despesa | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}">    <link rel="icon" type="image/png" th:href="@{/images/logo-apecan.png(v=2)}">
</head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo conteudo-estreito"><section class="cabecalho-pagina"><div><p class="rotulo">Financeiro</p><h1>Nova despesa</h1><p class="texto-secundario">O valor será registrado automaticamente como uma saída financeira.</p></div><a class="botao botao-secundario" th:href="@{/financeiro/despesas}">Voltar</a></section><form class="cartao formulario" th:action="@{/financeiro/despesas}" th:object="${despesaForm}" method="post"><div class="alerta alerta-erro" role="alert" th:if="${#fields.hasAnyErrors()}">Revise os campos indicados antes de continuar.</div><label for="tipo">Tipo</label><input id="tipo" th:field="*{tipo}" maxlength="50" required><p class="erro-campo" th:errors="*{tipo}"></p><label for="descricao">Descrição</label><input id="descricao" th:field="*{descricao}" maxlength="255" required><p class="erro-campo" th:errors="*{descricao}"></p><label for="nota">Número da nota fiscal</label><input id="nota" th:field="*{numeroNotaFiscal}" maxlength="20" required><p class="erro-campo" th:errors="*{numeroNotaFiscal}"></p><label for="valor">Valor</label><input id="valor" type="number" step="0.01" min="0.01" th:field="*{valor}" required><p class="erro-campo" th:errors="*{valor}"></p><label for="data">Data</label><input id="data" type="date" th:field="*{data}" required><p class="erro-campo" th:errors="*{data}"></p><label for="destino">Destino ou beneficiário</label><input id="destino" th:field="*{destino}" maxlength="150" required><p class="erro-campo" th:errors="*{destino}"></p><div class="acoes"><button class="botao botao-primario">Registrar despesa</button><a class="botao" th:href="@{/financeiro/despesas}">Cancelar</a></div></form></main>
</body></html>
