<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Despesas | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><div><p class="rotulo">Financeiro</p><h1>Despesas</h1><p class="texto-secundario">Acompanhe os gastos registrados pela associação.</p></div><div class="acoes"><a class="botao botao-secundario" th:href="@{/financeiro}">Voltar ao financeiro</a><a class="botao botao-primario" th:href="@{/financeiro/despesas/nova}">Nova despesa</a></div></section><div class="cartao tabela-responsiva" tabindex="0" aria-label="Lista de despesas"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Nota fiscal</th><th>Valor</th></tr></thead><tbody><tr th:each="d : ${pagina.content}"><td th:text="${d.data}"></td><td th:text="${d.tipo}"></td><td th:text="${d.descricao}"></td><td th:text="${d.numeroNotaFiscal}"></td><td th:text="|R$ ${d.valor}|"></td></tr><tr th:if="${pagina.empty}"><td colspan="5">Nenhuma despesa registrada.</td></tr></tbody></table></div><nav class="paginacao" aria-label="Paginação" th:if="${pagina.totalPages > 1}"><a class="botao botao-secundario" th:if="${pagina.hasPrevious()}" th:href="@{/financeiro/despesas(pagina=${pagina.number - 1})}">Anterior</a><span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span><a class="botao botao-secundario" th:if="${pagina.hasNext()}" th:href="@{/financeiro/despesas(pagina=${pagina.number + 1})}">Próxima</a></nav></main>
</body></html>
