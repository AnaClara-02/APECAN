<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Despesas | APECAN</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="conteudo"><div th:replace="~{fragments/cabecalho :: mensagens}"></div><section class="cabecalho-pagina"><h1>Despesas</h1><a class="botao botao-primario" th:href="@{/financeiro/despesas/nova}">Nova despesa</a></section><div class="cartao"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descricao</th><th>Nota fiscal</th><th>Valor</th></tr></thead><tbody><tr th:each="d:${pagina.content}"><td th:text="${d.data}"></td><td th:text="${d.tipo}"></td><td th:text="${d.descricao}"></td><td th:text="${d.numeroNotaFiscal}"></td><td th:text="|R$ ${d.valor}|"></td></tr></tbody></table></div></main></body></html>
