<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Despesas | APECAN</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo-apecan.png(v=2)}">
</head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main id="conteudo-principal" class="conteudo">
    <div th:replace="~{fragments/cabecalho :: mensagens}"></div>
    <section class="cabecalho-pagina">
        <div>
            <p class="rotulo">Financeiro</p>
            <h1>Despesas</h1>
            <p class="texto-secundario">Consulte despesas pagas e seus dados fiscais.</p>
        </div>
        <div class="acoes">
            <a class="botao botao-secundario" th:href="@{/financeiro}">Voltar ao financeiro</a>
            <a class="botao botao-primario" th:href="@{/financeiro/despesas/nova}">Nova despesa</a>
        </div>
    </section>

    <form class="filtros" method="get" th:action="@{/financeiro/despesas}">
        <div>
            <label for="inicio">Pagamento a partir de</label>
            <input id="inicio" type="date" name="inicio" th:value="${inicio}">
        </div>
        <div>
            <label for="fim">Pagamento até</label>
            <input id="fim" type="date" name="fim" th:value="${fim}">
        </div>
        <button class="botao botao-secundario" type="submit">Filtrar</button>
        <a class="botao" th:href="@{/financeiro/despesas}">Limpar filtros</a>
    </form>

    <article class="indicador resumo-despesas">
        <span class="indicador-rotulo">Total das despesas filtradas</span>
        <strong class="indicador-valor"
                th:text="|R$ ${#numbers.formatDecimal(totalDespesas, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</strong>
        <span class="indicador-ajuda" th:text="|Registros nesta página: ${pagina.numberOfElements}|"></span>
    </article>

    <div class="cartao tabela-responsiva secao" tabindex="0" aria-label="Lista de despesas">
        <table>
            <thead>
            <tr>
                <th>Data de pagamento</th>
                <th>Tipo</th>
                <th>Descrição</th>
                <th>Nota fiscal</th>
                <th>Banco</th>
                <th>Valor</th>
                <th><span class="sr-only">Ações</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${pagina.content}"
                th:with="voltarUrl=@{/financeiro/despesas(inicio=${inicio},fim=${fim},pagina=${pagina.number})}">
                <td th:text="${#temporals.format(d.dataPagamento, 'dd/MM/yyyy')}"></td>
                <td th:text="${d.tipo}"></td>
                <td th:text="${d.descricao}"></td>
                <td th:text="${d.numeroNotaExibido}"></td>
                <td th:text="${d.bancoPagamentoDescricao}"></td>
                <td th:text="|R$ ${#numbers.formatDecimal(d.valor, 1, 'POINT', 2, 'COMMA')}|"></td>
                <td class="acoes-tabela">
                    <a th:href="@{/financeiro/despesas/{id}(id=${d.id},inicio=${inicio},fim=${fim},pagina=${pagina.number})}">Consultar</a>
                    <th:block th:replace="~{fragments/exclusao-teste :: botao(tipo='DESPESA',id=${d.id},voltar=${voltarUrl})}"></th:block>
                </td>
            </tr>
            <tr th:if="${pagina.empty}">
                <td colspan="7">Nenhuma despesa encontrada nesse período.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="paginacao" aria-label="Paginação" th:if="${pagina.totalPages > 1}">
        <a class="botao botao-secundario" th:if="${pagina.hasPrevious()}"
           th:href="@{/financeiro/despesas(inicio=${inicio},fim=${fim},pagina=${pagina.number - 1})}">Anterior</a>
        <span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|"></span>
        <a class="botao botao-secundario" th:if="${pagina.hasNext()}"
           th:href="@{/financeiro/despesas(inicio=${inicio},fim=${fim},pagina=${pagina.number + 1})}">Próxima</a>
    </nav>
</main>
</body>
</html>
