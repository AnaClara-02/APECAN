# Sobreposicao exclusiva para a instancia hospedada; usar junto de prod.
server.address=0.0.0.0
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=50
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.flyway.user=${APECAN_DB_MIGRATION_USERNAME}
spring.flyway.password=${APECAN_DB_MIGRATION_PASSWORD}
apecan.mail.transporte=brevo
apecan.backup.tamanho-maximo=5MB
apecan.backup.timeout=5m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=never

